name: diffusiongemma-26b-mlx-vlm-sweep

database: results/llm_refinery.duckdb

commands:
  bench: ["llama", "bench"]
  # Keep the serving environment fixed; metadata comes from this process, not the client.
  server:
    - uv
    - run
    - --no-project
    - --python
    - "3.11"
    - --with
    - mlx-vlm==0.6.3
    - --with
    - mlx-lm==0.31.3
    - --with
    - mlx==0.31.2
    - python
    - tools/mlx_runtime.py
    - serve
    - --runtime-report
    - results/mlx-runtime-8082.json

models:
  # Best first run on the 32 GB Mac: official MLX 4bit, ~15.7 GB on disk.
  - name: diffusiongemma-26b-mlx-4bit
    hf: mlx-community/diffusiongemma-26B-A4B-it-4bit
    params:
      revision: 0d2cee4aa112548df2fad35a7f017eeb1ac8f352

  # Smallest MLX DiffusionGemma checkpoint, useful if memory pressure is high.
  - name: diffusiongemma-26b-mlx-mxfp4
    hf: mlx-community/diffusiongemma-26B-A4B-it-mxfp4

  # Alternative FP4 quant; worth comparing against 4bit/mxfp4 before trying 5bit+.
  - name: diffusiongemma-26b-mlx-nvfp4
    hf: mlx-community/diffusiongemma-26B-A4B-it-nvfp4

  # Quality-bump candidate. More likely to swap on the 32 GB Mac; run after 4bit.
  - name: diffusiongemma-26b-mlx-5bit
    hf: mlx-community/diffusiongemma-26B-A4B-it-5bit

# This file is mainly for `llm-refinery server`; MLX low-level benchmarking is not
# parsed by the llama-bench parser. HTTP/lm-eval checks are in the companion config.
bench:
  prompt_tokens: [512]
  gen_tokens: [128]
  repetitions: 1
  output: json
  extra_args: []

server:
  model_flag: "--model"
  params:
    host: 127.0.0.1
    port: 8082
    prefill_step_size: 2048
    max_tokens: 512
    max_kv_size: 8192
    # This also caps prompt + requested output tokens at server admission.
    # Boundary probes above 8192 require the diagnostic launch documented below.
    # The launcher forwards prefill size to the pinned native diffusion API.
    # max_kv_size controls admission; the model builds its own cache layout.
    # Inspect observed_diffusion_arguments and observed_cache_layout in the report.
    # Checkpoint weight quantization does not enable KV-cache quantization.
    vision_cache_size: 4
    log_level: INFO
  extra_args: []
  env:
    # Bound time waiting for the first token while testing new prompt workloads.
    MLX_VLM_TOKEN_QUEUE_TIMEOUT: "300"
